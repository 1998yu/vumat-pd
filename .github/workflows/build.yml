name: build-and-test

on:
  push:
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install compilers
        run: sudo apt-get update && sudo apt-get install -y gfortran ninja-build libeigen3-dev
      - name: Configure
        run: cmake --preset release -DVUMAT_PD_EIGEN_CHECK=ON
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release
      - name: Verify benchmark archive integrity
        run: python benchmarks/tensile3d/unpack_archive.py
      - name: Recompute archived benchmark metrics
        run: |
          python -m pip install -r benchmarks/tensile3d/requirements.txt
          python benchmarks/tensile3d/analyse_and_plot.py
          python benchmarks/tensile3d/verify_metrics.py
